name: devsecops-pipeline
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write        # SARIF upload only

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # pin to a full commit SHA in production
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy vulnauto soarflow --ignore-missing-imports
      - run: pytest -q

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run semgrep scan --config p/python --config p/secrets --sarif -o semgrep.sarif --error
      - run: pipx run bandit -r vulnauto soarflow -ll
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: semgrep.sarif, category: semgrep }

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run pip-audit -r requirements.txt --strict

  # IaC scanning (Checkov) runs per environment in infra.yml.

  container:
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vulnauto:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vulnauto:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  security-gate:
    runs-on: ubuntu-latest
    needs: [sast, sca, container]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Vulnerability threshold gate
        env:
          VULN_API_URL: ${{ vars.VULN_API_URL }}
          VULN_API_TOKEN: ${{ secrets.VULN_API_TOKEN }}   # never echo; masked in logs
          VULN_THRESHOLD: CRITICAL
        run: python -m vulnauto.cli --allowlist samples/allowlist.txt --out-dir reports
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: vuln-reports, path: reports/ }
