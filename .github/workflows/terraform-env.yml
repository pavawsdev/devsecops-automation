# Reusable: plan -> policy scan -> (gated) apply for ONE environment.
# Called by infra.yml; never triggered directly.
name: terraform-env

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      plan_role_arn:
        type: string
        required: true
        description: Read-only role in the target account (state read + resource describe).
      apply:
        type: boolean
        default: false
      fail_on_changes:
        type: boolean
        default: false
        description: Drift detection - fail when the plan is not empty.

permissions:
  contents: read
  id-token: write # GitHub OIDC -> AWS, no long-lived keys

env:
  TF_ENV: ${{ inputs.environment }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VERSION: "1.15.5"
  AWS_REGION: us-east-1

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4 # pin to a full commit SHA in production
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.plan_role_arn }}
          role-session-name: tf-plan-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init -backend-config="envs/$TF_ENV/backend.hcl"

      # Read-only role, so no state lock here; `apply tfplan` below takes the lock and
      # refuses to run if the state changed after this plan was made.
      - id: plan
        run: |
          set +e
          terraform plan -lock=false -var-file="envs/$TF_ENV/terraform.tfvars" \
            -out=tfplan -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

      - name: Plan summary
        run: |
          {
            echo "### Terraform plan: \`$TF_ENV\` (changes: ${{ steps.plan.outputs.has_changes }})"
            echo '<details><summary>Show plan</summary>'
            echo; echo '```'
            terraform show -no-color tfplan | head -c 60000
            echo '```'; echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # Scans what will actually be deployed to THIS environment (counts resolved),
      # with this environment's accepted-risk list.
      - name: Checkov (plan)
        run: |
          terraform show -json tfplan > tfplan.json
          pipx run checkov -f tfplan.json --framework terraform_plan \
            --repo-root-for-plan-enrichment . \
            --config-file "envs/$TF_ENV/checkov.yaml" --compact --quiet
          rm -f tfplan.json

      - name: Drift check
        if: inputs.fail_on_changes && steps.plan.outputs.has_changes == 'true'
        run: |
          echo "::error::$TF_ENV has drifted from main - see the plan in the job summary"
          exit 1

      - if: inputs.apply && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 3

  apply:
    name: apply (${{ inputs.environment }})
    needs: plan
    # No-op plans skip the job, so nobody is asked to approve "no changes".
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    # GitHub Environment: holds the apply role ARN and the protection rules
    # (required reviewers, main-only deployment branch, optional wait timer).
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }} # environment-scoped variable
          role-session-name: tf-apply-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init -backend-config="envs/$TF_ENV/backend.hcl"
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra
      # Applies exactly the plan the reviewer approved - nothing re-planned.
      - run: terraform apply -lock-timeout=10m tfplan
